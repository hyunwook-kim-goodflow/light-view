[package]
name = "lv-app"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lv-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
lv-core = { path = "../lv-core" }
lv-ipc = { path = "../lv-ipc" }
lv-sandbox = { path = "../lv-sandbox" }
# The update check reads GitHub's Releases API answer.
serde_json = "1"
# `#[implement]` (COM callbacks) names this crate directly.
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# A container whose start always fails, for the fallback tests.
lv-sandbox = { path = "../lv-sandbox", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"
