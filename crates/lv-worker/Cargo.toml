[package]
name = "lv-worker"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "light-view's sandboxed HEIF decode worker (stdin requests, stdout responses)."

[[bin]]
name = "lv-worker"
path = "src/main.rs"

[dependencies]
lv-core = { path = "../lv-core" }
lv-heif = { path = "../lv-heif" }
lv-ipc = { path = "../lv-ipc" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Threading"]
