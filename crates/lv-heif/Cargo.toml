[package]
name = "lv-heif"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Safe libheif wrapper for light-view's HEIC worker (links libheif/libde265 dynamically)."

[dependencies]
# Pure Rust: thumbnail resampling and the `irot`/`imir` of thumbnail items.
lv-core = { path = "../lv-core" }
lv-ipc = { path = "../lv-ipc" }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_23"] }
