[package]
name = "lv-shell"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "light-view's Explorer extension (M7 Task 1 spike: per-user thumbnail handler that starts the sandboxed worker)."

[lib]
crate-type = ["cdylib"]

[dependencies]
lv-ipc = { path = "../lv-ipc" }
# `#[implement]` (COM objects) names this crate directly.
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
]
