# Twice-weekly fuzzing of the parsers of untrusted input (ruling R3): every target in fuzz/
# runs for 10 minutes with cargo-fuzz (libFuzzer + AddressSanitizer) on nightly, starting
# from its seeds in testdata/fuzz/<target>/. A crash or timeout fails the job and its
# input is uploaded as the artifact `fuzz-<target>`; fix it, then add the input to
# testdata/fuzz/<target>/ so `fuzz_corpus_replays` keeps replaying it on stable.
#
# The working corpus (fuzz/corpus/<target>: the seeds plus what libFuzzer kept) carries
# over between scheduled runs on main through the Actions cache, and each scheduled run
# also uploads it as the artifact `fuzz-corpus-<target>`. Carrying it over is best-effort:
# GitHub evicts cache entries unused for 7 days (and the oldest ones once the repository
# passes its cache quota), which is why the runs are 3-4 days apart. When the entry is
# gone, a run starts again from the seeds; nothing restores the uploaded artifact.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1,4" # Mondays and Thursdays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"
  # A dated nightly, so a new nightly cannot break or change the run unannounced; move it
  # forward by hand.
  FUZZ_TOOLCHAIN: "nightly-2026-10-27"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [format_decode, exif_info, exif_edit, heif_edit, jpeg_markers, ipc_frame]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust nightly
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          rustup default "$FUZZ_TOOLCHAIN"
          rustc --version

      - name: Cache cargo-fuzz
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ env.FUZZ_TOOLCHAIN }}-${{ runner.os }}

      - name: Install cargo-fuzz
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"

      # cargo-fuzz has no --locked flag; fetching with --locked first fails the job when
      # fuzz/Cargo.lock is out of date instead of letting the build rewrite it.
      - name: Check fuzz/Cargo.lock
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml

      # The corpus the last scheduled run on main left (the key is new every run, so the
      # newest entry under the prefix is restored).
      - name: Restore the working corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # The working corpus is the restored one plus the seeds, so new inputs libFuzzer
      # keeps never land in testdata/.
      - name: Fuzz for 10 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cp "testdata/fuzz/$TARGET/"* "fuzz/corpus/$TARGET/"
          cargo fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time=600 -rss_limit_mb=4096 -timeout=10

      - name: Save the working corpus
        if: ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload the working corpus
        if: ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
