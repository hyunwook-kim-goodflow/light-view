# Weekly fuzzing of the parsers of untrusted input (ruling R3): every target in fuzz/
# runs for 10 minutes with cargo-fuzz (libFuzzer + AddressSanitizer) on nightly, starting
# from its seeds in testdata/fuzz/<target>/. A crash or timeout fails the job and its
# input is uploaded as the artifact `fuzz-<target>`; fix it, then add the input to
# testdata/fuzz/<target>/ so `fuzz_corpus_replays` keeps replaying it on stable.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [format_decode, exif_info, exif_edit, heif_edit, jpeg_markers, ipc_frame]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustc --version

      - name: Cache cargo-fuzz
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}

      - name: Install cargo-fuzz
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"

      # The working corpus starts as a copy of the seeds, so new inputs libFuzzer keeps
      # never land in testdata/.
      - name: Fuzz for 10 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cp "testdata/fuzz/$TARGET/"* "fuzz/corpus/$TARGET/"
          cargo fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time=600 -rss_limit_mb=4096 -timeout=10

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
