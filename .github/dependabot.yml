# Weekly update pull requests for Cargo crates (root workspace and the fuzz crate) and
# the pinned GitHub Actions. vcpkg ports are pinned through vcpkg-configuration.json and
# updated by hand together with scripts/setup-deps.ps1.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
