# light-view website (Zola). Build: zola --root site build. See site/README.md.
base_url = "https://lightview.goodflow.dev"
title = "light-view"
description = "아이폰 사진(HEIC)도 바로 여는 가벼운 무료 Windows 사진 뷰어"
default_language = "ko"
compile_sass = true
minify_html = false
build_search_index = false
# Feeds are turned on per section (releases only).
generate_feeds = false
feed_filenames = ["atom.xml"]
taxonomies = []

# Keep dots in addresses (/releases/0.2.0/); only characters unsafe in paths are changed.
[slugify]
paths = "safe"

[markdown]
smart_punctuation = false
external_links_target_blank = false
external_links_no_follow = false
external_links_no_referrer = true

[languages.en]
title = "light-view"
description = "A light, free Windows photo viewer that opens iPhone photos (HEIC) too"
generate_feeds = false
build_search_index = false
taxonomies = []

[extra]
repo = "hyunwook-kim-goodflow/light-view"
# GitHub Sponsors page; empty until the Sponsors profile is approved (no link is built).
sponsor_url = ""

# Ads are off: with enabled = false no ad script, slot or ads.txt is built.
# client: the AdSense publisher ID. While enabled = false it only adds the
# google-adsense-account meta tag (site verification); no ad code, no ads.txt.
[extra.ads]
enabled = false
client = "ca-pub-9134135891782141"

# Manual ad unit IDs per slot (no Auto ads). Slots: home (after the features), releases
# (after the list), release (after the notes), faq (at the end).
[extra.ads.slots]
home = ""
releases = ""
release = ""
faq = ""

# Cloudflare Web Analytics token; empty = no analytics script and no analytics notice on
# the privacy page. Set it here rather than turning on automatic setup in the Cloudflare
# dashboard, which injects the script without the notice.
[extra.analytics]
token = ""

